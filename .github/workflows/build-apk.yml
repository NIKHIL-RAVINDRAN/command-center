name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install
      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android
      - name: Add step counter
        run: |
          SRC=android/app/src/main/java/com/nikhil/commandcenter
          mkdir -p $SRC
          cp native/*.java $SRC/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i '0,/dependencies {/s//dependencies {\n    implementation "androidx.work:work-runtime:2.9.1"/' android/app/build.gradle
          grep -n "ACTIVITY_RECOGNITION" android/app/src/main/AndroidManifest.xml
          grep -n "work-runtime" android/app/build.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CommandCenter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
